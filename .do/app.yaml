name: rasa-heroku-template
region: syd1
services:
  - name: web
    github:
      repo: bikramkgupta/rasa-heroku-template
      branch: app_platform
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # No environment variables needed for basic Rasa NLU functionality